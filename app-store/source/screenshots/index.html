<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EarlyOtter Screens</title>
<style>
@font-face { font-family: "SFR"; src: url("SFNSRounded.ttf"); font-weight: 1 1000; }
@font-face { font-family: "SFP"; src: url("SFNS.ttf"); font-weight: 1 1000; }
@font-face { font-family: "Fraunces"; src: url("Fraunces.ttf"); font-weight: 100 900; font-style: normal; }
@font-face { font-family: "Fraunces"; src: url("Fraunces-Italic.ttf"); font-weight: 100 900; font-style: italic; }

:root {
  /* Night Swim: midnight navy, cream, starlight gold; deep gold for accents on cream. */
  --ink: #0b1428; --cream: #f2eadc; --gold: #f4c66a; --clay: #a8791f;
  --M: 96px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; }
body { font-family: "SFP", system-ui; -webkit-font-smoothing: antialiased; }
.strip { display: flex; }

/* ---------- Panels ---------- */
.panel { position: relative; width: 1320px; height: 2868px; overflow: hidden; flex: none; }
.panel.ink     { background: var(--ink);     color: var(--cream); --fg: var(--cream); --accent: var(--gold); --line: rgba(242,234,220,.22); --shadow: 0 80px 140px rgba(0,0,0,.55), 0 20px 40px rgba(0,0,0,.35); }
.panel.cream   { background: var(--cream);   color: var(--ink);   --fg: var(--ink);   --accent: var(--clay);    --line: rgba(11,20,40,.16);   --shadow: 0 90px 120px -40px rgba(11,20,40,.45), 0 24px 50px rgba(11,20,40,.14); }
.panel.gold { background: var(--gold); color: var(--ink);   --fg: var(--ink);   --accent: var(--ink);     --line: rgba(11,20,40,.22);   --shadow: 0 90px 120px -40px rgba(80,60,10,.45), 0 24px 50px rgba(80,60,10,.18); }
.grain { position: absolute; inset: 0; pointer-events: none; z-index: 20; opacity: .09; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }

/* ---------- Typography ---------- */
.rule { position: absolute; left: 0; right: 0; top: 168px; height: 2px; background: var(--line); z-index: 4; }
.index { position: absolute; left: var(--M); top: 146px; z-index: 5; display: flex; align-items: center; gap: 22px; padding-right: 26px;
  font-family: "SFP"; font-size: 28px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
.panel.ink .index { background: var(--ink); } .panel.cream .index { background: var(--cream); } .panel.gold .index { background: var(--gold); }
.index b { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); letter-spacing: .04em; }
.index span { opacity: .62; }
.head { position: absolute; left: var(--M); right: var(--M); top: 262px; z-index: 5; }
h1 { font-family: "Fraunces"; font-weight: 480; font-size: 150px; line-height: .96; letter-spacing: -0.032em;
  font-variation-settings: "opsz" 144, "SOFT" 60, "WONK" 0; }
h1 i { font-style: italic; font-weight: 420; color: var(--accent); font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; letter-spacing: -0.02em; }
.sub { margin-top: 46px; max-width: 1060px; font-size: 42px; line-height: 1.36; letter-spacing: -0.012em; opacity: .66; font-weight: 450; }
.num { font-family: "Fraunces"; font-variant-numeric: lining-nums tabular-nums; font-variation-settings: "opsz" 144, "SOFT" 40, "WONK" 0; letter-spacing: -0.03em; }

/* ---------- Device ---------- */
.device { position: absolute; width: 1000px; height: 2102px; z-index: 3; transform-origin: 0 0; }
.device .rim { position: absolute; inset: 0; border-radius: 168px; box-shadow: var(--shadow);
  background: linear-gradient(135deg, #6e7075 0%, #2c2d31 14%, #17181a 40%, #3a3c40 66%, #16171a 86%, #5a5c61 100%); }
.device .bezel { position: absolute; inset: 7px; border-radius: 161px; background: #030303; }
.device .screen { position: absolute; left: 30px; top: 30px; width: 940px; height: 2042px; border-radius: 132px; overflow: hidden; background: #000; }
.device .btn { position: absolute; width: 9px; border-radius: 4px; background: linear-gradient(90deg,#18191b,#55575c,#18191b); }

/* ---------- App (points) ---------- */
.app { position: absolute; left: 0; top: 0; width: 440px; height: 956px; zoom: 2.13636; overflow: hidden; font-family: "SFP"; color: #fff; }
.island { position: absolute; left: 50%; top: 11px; width: 126px; height: 37px; margin-left: -63px; border-radius: 20px; background: #000; z-index: 50; }
.status { position: absolute; left: 0; right: 0; top: 0; height: 54px; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 50px; }
.status .time { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; color: #fff; width: 60px; text-align: center; }
.status .right { display: flex; align-items: center; gap: 7px; }
.i { display: inline-block; flex: none; background: currentColor; -webkit-mask-position: center; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; }
.row { display: flex; align-items: center; }
  background: rgba(40,40,42,.72); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 8px 30px rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: space-around; padding: 4px; z-index: 30; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);

const ic = (name, size, color) =>
  `<span class="i" style="width:${size}px;height:${size}px;background:${color};-webkit-mask-image:url('sym/${name}.png')"></span>`;

// Screens are real renders of the app (app/*.png); only the status bar is drawn here.
const RENDER_TIME = '8:13';
const statusBar = `<div class="app" style="height:60px;background:none"><div class="island"></div>
  <div class="status"><div class="time">${RENDER_TIME}</div>
    <div class="right" style="color:#fff">${ic('cellularbars', 18, '#fff')}${ic('wifi', 17, '#fff')}${ic('battery.100percent', 27, '#fff')}</div></div></div>`;
const shot = name => `<img src="app/${name}.png" style="width:100%;display:block">${statusBar}`;

function device(x, y, screen, scale = 1, z = 3) {
  return `<div class="device" style="left:${x}px;top:${y}px;transform:scale(${scale});z-index:${z}">
    <div class="rim"></div><div class="bezel"></div>
    <div class="btn" style="left:-6px;top:360px;height:90px"></div>
    <div class="btn" style="left:-6px;top:500px;height:160px"></div>
    <div class="btn" style="left:-6px;top:690px;height:160px"></div>
    <div class="btn" style="right:-6px;top:560px;height:250px"></div>
    <div class="screen">${screen}</div></div>`;
}
const head = (n, label, h, sub) => `
  <div class="rule"></div>
  <div class="index"><b>${n}</b><span>${label}</span></div>
  <div class="head"><h1>${h}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;

const panels = [];

/* 01 — Hero */
panels.push(['ink', () => `
  ${head('01', 'Calendar alarm', 'Your alarm,<br>set by your<br><i>calendar.</i>', '')}
  ${device(160, 900, shot('home'))}
`]);

/* 02 — The math */
panels.push(['cream', () => {
  const row = (numHTML, title, meta, marker, opts = {}) => `
    <div class="row" style="height:${opts.h || 132}px;border-top:${opts.bt || '2px solid var(--line)'};gap:0">
      <div style="width:400px">${numHTML}</div>
      <div style="flex:1"><div style="font-size:${opts.ts || 44}px;font-weight:600;letter-spacing:-0.015em">${title}</div>
        <div style="font-size:30px;opacity:.55;margin-top:6px">${meta}</div></div>
      ${marker}</div>`;
  const dot = c => `<div style="width:34px;height:34px;border-radius:50%;background:${c};box-shadow:0 0 0 8px ${c}26"></div>`;
  return `
  ${head('02', 'Built-in math', 'Prep and<br>commute,<br><i>built in.</i>', '')}
  <div style="position:absolute;left:var(--M);right:var(--M);top:770px;z-index:5">
    ${row(`<span class="num" style="font-size:104px;font-weight:500">9:00</span>`, 'Biology Class', 'First event of the day', dot('#6ed3e0'))}
    ${row(`<span class="num" style="font-size:104px;font-weight:300;opacity:.5">−0:35</span>`, 'Prep time', 'Shower, coffee, get dressed', `<div style="opacity:.5">${ic('cup.and.saucer.fill', 40, 'var(--ink)')}</div>`)}
    ${row(`<span class="num" style="font-size:104px;font-weight:300;opacity:.5">−0:30</span>`, 'Commute', 'Door to lecture hall', `<div style="opacity:.5">${ic('car.fill', 40, 'var(--ink)')}</div>`)}
    ${row(`<span class="num" style="font-size:164px;font-weight:600;color:var(--clay)">7:55</span>`, 'Wake up', 'Alarm set automatically', dot('#f4c66a'), { h: 200, bt: '5px solid var(--ink)', ts: 52 })}
  </div>
  ${device(160, 1440, shot('details'))}
`;}]);

/* 03 — Week */
panels.push(['gold', () => `
  ${head('03', 'Every day is different', 'Life changes.<br><i>Your alarm</i><br>should too.', '')}
  <img src="app/week.png" style="position:absolute;left:var(--M);top:1300px;width:1128px;border-radius:86px;z-index:5;box-shadow:var(--shadow)">
`]);

/* 04 — Rules */
panels.push(['ink', () => `
  ${head('04', 'Custom rules', 'A rule for<br>every kind<br>of <i>morning.</i>', '')}
  ${device(56, 850, shot('rules'), .8, 3)}
  ${device(464, 1030, shot('editor'), .8, 4)}
`]);

/* 05 — Sleep in */
panels.push(['gold', () => `
  ${head('05', 'Days off', 'No early plans?<br><i>Sleep in.</i>', 'A latest wake-up on quiet mornings. Days off stay silent.')}
  <img src="OtterOverlook.png" style="position:absolute;width:380px;left:736px;top:780px;z-index:2">
  ${device(160, 1078, shot('schedule'))}
`]);

const only = P.has('p') ? [+P.get('p')] : panels.map((_, i) => i);
document.getElementById('root').innerHTML = `<div class="strip">` + only.map(i =>
  `<div class="panel ${panels[i][0]}">${panels[i][1]()}<div class="grain"></div></div>`).join('') + `</div>`;
if (P.has('preview')) document.body.style.zoom = P.get('preview');
</script>
</body>
</html>
